[mgr]
ratio          = [1, 2, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap         = "no"
tab_size     = 2
max_width    = 600
max_height   = 900
image_delay  = 30
image_filter = "lanczos3"
image_quality = 80

[opener]
edit = [
    { run = '/usr/bin/nano "$@"', block = true, for = "unix" },
]
edit-nvim = [
    { run = '/opt/homebrew/bin/nvim "$@"', block = true, for = "unix" },
]
reveal = [
    { run = 'open -R "$1"', desc = "Reveal in Finder", for = "macos" },
]

[open]
prepend_rules = [
    { mime = "text/*",           use = "edit" },
    { mime = "application/json", use = "edit" },
]

[plugin]
prepend_previewers = [
    # Data files
    { url = "*.csv",     run = "duckdb" },
    { url = "*.tsv",     run = "duckdb" },
    { url = "*.parquet", run = "duckdb" },
    # Notebooks
    { url = "*.ipynb",   run = "nbpreview" },
    # Markup
    { url = "*.md",      run = "rich-preview" },
    { url = "*.rst",     run = "rich-preview" },
    # Audio (with cover art)
    { mime = "audio/*",  run = "exifaudio" },
    # Video metadata
    { mime = "video/*",  run = "mediainfo" },
    # Archives
    { mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },
]

prepend_preloaders = [
    { url = "*.csv",     run = "duckdb", multi = false },
    { url = "*.tsv",     run = "duckdb", multi = false },
    { url = "*.parquet", run = "duckdb", multi = false },
]

[tasks]
suppress_preload = false

[log]
enabled = false
